# Gruvbox OLED Theme for tmux
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'

# Overwrite colors - Gruvbox OLED (pure black background)
set -ogq @thm_bg "#000000"
set -ogq @thm_fg "#bfb191"

# Colors - Gruvbox OLED
set -ogq @thm_rosewater "#d4be98"
set -ogq @thm_flamingo "#ea6962"
set -ogq @thm_pink "#d3869b"
set -ogq @thm_mauve "#d3869b"
set -ogq @thm_red "#ea6962"
set -ogq @thm_maroon "#d75f5f"
set -ogq @thm_peach "#e78a4e"
set -ogq @thm_yellow "#d8a657"
set -ogq @thm_green "#a9b665"
set -ogq @thm_teal "#89b482"
set -ogq @thm_sky "#89b482"
set -ogq @thm_sapphire "#7daea3"
set -ogq @thm_blue "#7daea3"
set -ogq @thm_lavender "#89b482"

# Surfaces and overlays
set -ogq @thm_subtext_1 "#d5c4a1"
set -ogq @thm_subtext_0 "#bdae93"
set -ogq @thm_overlay_2 "#a89984"
set -ogq @thm_overlay_1 "#928374"
set -ogq @thm_overlay_0 "#7c6f64"
set -ogq @thm_surface_2 "#504945"
set -ogq @thm_surface_1 "#3c3836"
set -ogq @thm_surface_0 "#282828"
set -ogq @thm_mantle "#0a0a0a"
set -ogq @thm_crust "#050505"

# Pane borders and status bg
set -g pane-border-style fg="#282828"
set -g pane-active-border fg="#282828"
set -g status-bg "#000000"
set -g message-style 'bg=#000000 fg=default'
set -g mode-style "reverse"

# Popup styling
set -g popup-style 'bg=#000000'
set -g popup-border-style 'fg=#504945,bg=#504945'
